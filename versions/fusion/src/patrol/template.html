<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181e20"><title>PATROL — Northlake Air District</title><style>/* STYLE */</style></head>
